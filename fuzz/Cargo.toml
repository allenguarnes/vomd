# Fuzz targets: `cargo +nightly fuzz run <doc|image|anim|layout|settings|svg>`, or on
# stable with `just fuzz <target> [seconds]`. Never shipped.
[package]
name = "vomd-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vomd = { path = "..", default-features = false, features = ["embed-fonts", "images", "svg"] }

# As in ../Cargo.toml.
[patch.crates-io]
image-webp = { path = "../vendor/image-webp" }
resvg = { path = "../vendor/resvg" }
simplecss = { path = "../vendor/simplecss" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "doc"
path = "fuzz_targets/doc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anim"
path = "fuzz_targets/anim.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg"
path = "fuzz_targets/svg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout"
path = "fuzz_targets/layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings"
path = "fuzz_targets/settings.rs"
test = false
doc = false
bench = false
