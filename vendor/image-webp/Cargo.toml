# image-webp 0.2.4 from crates.io (git 08b57d47), with VOMD's patch: see VOMD-PATCH.md. The
# library's sources and licenses only: no tests, benches, examples or dev-dependencies.
[package]
name = "image-webp"
version = "0.2.4"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80.1"

description = "WebP encoding and decoding in pure Rust"
homepage = "https://github.com/image-rs/image-webp"
repository = "https://github.com/image-rs/image-webp"
categories = ["multimedia::images", "multimedia::encoding", "encoding"]

[dependencies]
byteorder-lite = "0.1.0"
quick-error = "2.0.1"

[features]
_benchmarks = []
