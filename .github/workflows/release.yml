# A `v*` tag builds the Linux x86_64 release (baseline x86-64, no target-cpu, in a Debian 12
# container), checks the budgets and the .deb and AppImage on Debian and Ubuntu, builds and
# tests the Windows x86_64 zip, and attaches the tarball, .deb, AppImage and zip, their
# checksums and the budget report to the GitHub release, whose notes are the version's CHANGELOG
# section.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Display libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libx11-6 libx11-xcb1 \
            libxcb1 libxcursor1 libxi6 libxkbcommon0 libxkbcommon-x11-0 binutils
      - name: The tag matches Cargo.toml and the CHANGELOG dates it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
      - run: cargo test --workspace --locked
      # A shared runner is two to three times slower than the machine the time budgets are
      # for, so start and scroll times are reported here, not gated; size and memory still are.
      # The size measured here is the runner's binary, not the one that ships: that one is built
      # in Debian 12 below, where `cargo xtask dist` fails if it is over the same size budget.
      # `cargo xtask budgets` on an idle machine gates them all before a release.
      - name: Budgets
        run: |
          xvfb-run -a -s "-screen 0 3840x2160x24" \
            cargo xtask budgets --timings-advisory --report budgets.md
      - name: Tarball, .deb and AppImage, built in Debian 12 (fails on newer glibc or an oversized binary)
        run: scripts/pkg-build.sh
      - name: The .deb and AppImage on Debian 12, Debian 13 and Ubuntu 24.04
        run: scripts/pkg-check.sh
      # (The report goes in dist/ too, so the artifact's files are all at its top level.)
      - run: cp budgets.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.sha256
            dist/budgets.md
          if-no-files-found: error

  windows-x86_64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --locked
      - name: The zip (fails on an oversized binary)
        run: cargo xtask dist --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [linux-x86_64, windows-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are this version's CHANGELOG section, its wrapped lines joined (GitHub
          # shows every line break in release notes); a nested item keeps its indent.
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && (/^## / || /^\[[^]]+\]: /) { exit }
            !on { next }
            /^$/ || /^#/ { if (buf != "") print buf; buf = ""; print; next }
            /^ *- / { if (buf != "") print buf; buf = $0; next }
            { sub(/^ +/, ""); buf = buf == "" ? $0 : buf " " $0 }
            END { if (buf != "") print buf }
          ' CHANGELOG.md > changes.md
          test -s changes.md
          {
            cat changes.md
            echo
            echo "<details><summary>Budgets, measured on the release runner</summary>"
            echo
            echo "A shared runner is two to three times slower than the machine the time budgets"
            echo "are for, so start and scroll times are reported here, not gated."
            echo
            cat dist/budgets.md
            echo
            echo "</details>"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "VOMD $GITHUB_REF_NAME" \
            --notes-file notes.md dist/*.tar.gz dist/*.deb dist/*.AppImage dist/*.zip \
            dist/*.sha256 dist/budgets.md
