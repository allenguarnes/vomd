# Every fuzz target for an hour a night (cargo-fuzz, nightly, AddressSanitizer).
# Crashes are uploaded as artifacts; the corpus is cached between runs.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "3600"

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [doc, image, anim, layout, settings, svg]
    steps:
      - uses: actions/checkout@v4
      - name: Nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed the corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          if [ "${{ matrix.target }}" = image ]; then
            cp fixtures/images/* fuzz/corpus/image/
          elif [ "${{ matrix.target }}" = svg ]; then
            cp fixtures/images/*.svg* fuzz/corpus/svg/
          elif [ "${{ matrix.target }}" = anim ]; then
            cp fixtures/images/*.gif fixtures/images/*.webp fuzz/corpus/anim/
          elif [ "${{ matrix.target }}" != settings ]; then
            find fixtures -maxdepth 1 -name '*.md' -size -16k -exec cp {} fuzz/corpus/${{ matrix.target }}/ \;
          fi
          # Sample files and the inputs of past findings.
          if [ -d fuzz/seeds/${{ matrix.target }} ]; then
            cp fuzz/seeds/${{ matrix.target }}/* fuzz/corpus/${{ matrix.target }}/
          fi
      - name: Minimize the cached corpus
        run: cargo +nightly fuzz cmin -a ${{ matrix.target }}
      - name: Fuzz
        run: |
          case ${{ matrix.target }} in
            doc | image | anim | svg) max_len=65536 ;; layout) max_len=16384 ;; *) max_len=4096 ;;
          esac
          # An SVG that takes long to draw is what the `svg` target looks for.
          timeout=10; extra=
          if [ "${{ matrix.target }}" = svg ]; then timeout=2; extra=-dict=fuzz/svg.dict; fi
          cargo +nightly fuzz run -a ${{ matrix.target }} -- \
            -max_total_time=${{ inputs.seconds || '3600' }} -max_len=$max_len \
            -timeout=$timeout -rss_limit_mb=2048 -print_final_stats=1 $extra
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
