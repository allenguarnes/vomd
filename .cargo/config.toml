# Committed config: aliases only. Never put `target-cpu` here; release binaries must run on
# baseline x86-64. Local `-C target-cpu=native` belongs in an uncommitted config.
[alias]
xtask = "run --quiet --package xtask --"

# Packed relative relocations (RELR): −260 to −340 KB, keeps PIE/ASLR. Needs glibc ≥ 2.36.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-z,pack-relative-relocs"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-z,pack-relative-relocs"]
